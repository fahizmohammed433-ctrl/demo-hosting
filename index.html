<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f4;
      margin: 0;
    }

    .product-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product-title {
      font-size: 1.25rem;
      margin: 15px 0 10px;
    }

    .price {
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 10px;
    }

    /* സ്റ്റോക്ക് സ്റ്റാറ്റസ് കാണിക്കുന്ന ഭാഗം */
    .stock-badge {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 15px;
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .in-stock {
      color: #155724;
      background-color: #d4edda;
    }

    .out-of-stock {
      color: #721c24;
      background-color: #f8d7da;
    }

    /* കാർട്ട് ബട്ടൺ */
    .btn {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .btn-active {
      background-color: #0070f3;
      color: white;
    }

    .btn-active:hover {
      background-color: #0051b3;
    }

    .btn-disabled {
      background-color: #cccccc;
      color: #666666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="product-card">
    <img src="https://via.placeholder.com/300x200" alt="Product Image" class="product-image">
    <h2 class="product-title">Sample Product</h2>
    <div class="price">₹999</div>

    <!-- സ്റ്റോക്ക് വിവരം കാണിക്കാൻ -->
    <div id="stock-status" class="stock-badge"></div>

    <!-- ആഡ് ടു കാർട്ട് ബട്ടൺ -->
    <button id="cart-btn" class="btn">Add to Cart</button>
  </div>

  <script>
    // ഇവിടെ ക്വാണ്ടിറ്റി മാറ്റാം (0 ആക്കിയാൽ Out of Stock ആവും)
    const quantity = 0; 

    const stockStatus = document.getElementById("stock-status");
    const cartBtn = document.getElementById("cart-btn");

    if (quantity <= 0) {
      // ക്വാണ്ടിറ്റി 0 അല്ലെങ്കിൽ അതിൽ കുറവാണെങ്കിൽ
      stockStatus.innerText = "Out of Stock";
      stockStatus.classList.add("out-of-stock");
      
      cartBtn.innerText = "Sold Out";
      cartBtn.classList.add("btn-disabled");
      cartBtn.disabled = true; // ബട്ടൺ ക്ലിക്ക് ചെയ്യാൻ പറ്റാത്തവിധം ഡിസേബിൾ ചെയ്യുന്നു
    } else {
      // സ്റ്റോക്ക് ഉണ്ടെങ്കിൽ
      stockStatus.innerText = `In Stock (${quantity} left)`;
      stockStatus.classList.add("in-stock");
      
      cartBtn.innerText = "Add to Cart";
      cartBtn.classList.add("btn-active");
      cartBtn.disabled = false;
    }
  </script>

</body>
</html>
